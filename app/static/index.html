<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Agent Platform</title>
<style>
  :root {
    --orange: #D97706;
    --orange-light: #FEF3C7;
    --orange-hover: #B45309;
    --orange-border: #FCD34D;
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --text: #1C1917;
    --text-secondary: #78716C;
    --border: #E7E5E4;
    --green-bg: #F0FDF4;
    --green-text: #166534;
    --green-border: #BBF7D0;
    --red-bg: #FEF2F2;
    --red-text: #991B1B;
    --red-border: #FECACA;
    --amber-bg: #FFFBEB;
    --amber-text: #92400E;
    --amber-border: #FDE68A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #F59E0B, #D97706); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .badge { font-size: 11px; color: var(--text-secondary); background: #F5F5F4; padding: 2px 10px; border-radius: 10px; margin-left: auto; }

  /* Chat area */
  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: #D6D3D1; border-radius: 3px; }

  /* Messages */
  .msg { display: flex; gap: 14px; max-width: 820px; width: 100%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff;
    margin-top: 2px;
  }
  .msg.user .avatar { background: var(--orange); }
  .msg.assistant .avatar { background: #44403C; }

  .bubble { padding: 14px 18px; border-radius: 14px; font-size: 14px; line-height: 1.65; }
  .msg.user .bubble { background: #F5F5F4; color: var(--text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  .bubble .label { font-size: 11px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  /* Plan steps in bubble */
  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-item {
    display: flex; gap: 12px; padding: 12px; background: #FAFAF9;
    border: 1px solid var(--border); border-radius: 8px;
    transition: border-color 0.15s;
  }
  .plan-item:hover { border-color: var(--orange-border); }
  .plan-idx {
    width: 26px; height: 26px; border-radius: 50%; background: #FFF7ED;
    color: var(--orange); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    border: 1px solid var(--orange-border);
  }
  .plan-body { flex: 1; min-width: 0; }
  .plan-tool { font-weight: 600; font-size: 13px; }
  .plan-tool .tool-name { color: var(--orange); }
  .plan-action { color: var(--text-secondary); font-size: 12px; margin-left: 8px; font-weight: 500; }
  .plan-params { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .param-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: #FFF7ED; color: var(--amber-text); font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* Step type badge */
  .type-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 700; letter-spacing: 0.5px; }
  .type-badge.tool { background: #FEF3C7; color: #92400E; }
  .type-badge.reasoning { background: #EDE9FE; color: #5B21B6; }
  .plan-reasoning { background: #FAFAFE; border-color: #DDD6FE; }

  /* Result rows */
  .result-list { display: flex; flex-direction: column; gap: 6px; }
  .result-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 6px; font-size: 13px;
  }
  .result-row.ok { background: var(--green-bg); border: 1px solid var(--green-border); }
  .result-row.fail { background: var(--red-bg); border: 1px solid var(--red-border); }
  .result-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .result-dot.green { background: #22C55E; }
  .result-dot.red { background: #EF4444; }
  .result-step { font-weight: 600; color: var(--text-secondary); min-width: 45px; }
  .result-tool { font-weight: 500; }
  .result-status { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .result-status.success { background: #DCFCE7; color: var(--green-text); }
  .result-status.error { background: #FEE2E2; color: var(--red-text); }

  /* Verdict */
  .verdict { padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .verdict.pass { background: var(--green-bg); border: 1px solid var(--green-border); }
  .verdict.fail { background: var(--amber-bg); border: 1px solid var(--amber-border); }
  .verdict .v-header { font-weight: 700; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .verdict .v-header .icon { font-size: 16px; }
  .verdict .v-reason { color: var(--text-secondary); }
  .verdict .v-suggest { margin-top: 6px; font-size: 12px; color: var(--orange); }

  /* Status line */
  .status-line { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; }
  .status-line .val { font-weight: 600; color: var(--text); }

  /* Input bar */
  .input-bar {
    border-top: 1px solid var(--border); background: var(--surface);
    padding: 14px 24px; flex-shrink: 0;
  }
  .input-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .input-inner input {
    flex: 1; padding: 12px 18px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 14px; outline: none; background: #FAFAF9;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-inner input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(217,119,6,0.1); }
  .input-inner input::placeholder { color: #A8A29E; }
  .input-inner button {
    padding: 12px 22px; border: none; border-radius: 12px;
    background: var(--orange); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; white-space: nowrap;
  }
  .input-inner button:hover { background: var(--orange-hover); }
  .input-inner button:disabled { background: #D6D3D1; cursor: not-allowed; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .suggestions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; max-width: 820px; margin-left: auto; margin-right: auto; }
  .suggestion { font-size: 12px; padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; color: var(--text-secondary); transition: all 0.15s; background: var(--surface); white-space: nowrap; }
  .suggestion:hover { border-color: var(--orange); color: var(--orange); background: #FFF7ED; }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .empty .icon { font-size: 48px; margin-bottom: 16px; }

  /* Message enter animation */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg { animation: fadeIn 0.3s ease-out; }

  /* Auth overlay */
  .auth-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .auth-overlay.hidden { display: none; }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 36px; width: 380px; max-width: 90vw; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .auth-card h2 { font-size: 22px; margin-bottom: 6px; }
  .auth-card .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
  .auth-card input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; margin-bottom: 12px; outline: none; background: #FAFAF9;
    transition: border-color 0.15s;
  }
  .auth-card input:focus { border-color: var(--orange); }
  .auth-card button {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--orange); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .auth-card button:hover { background: var(--orange-hover); }
  .auth-card .switch {
    text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary);
  }
  .auth-card .switch a { color: var(--orange); cursor: pointer; text-decoration: none; font-weight: 600; }
  .auth-card .error { color: #EF4444; font-size: 12px; margin-bottom: 8px; }
  .logout-btn { cursor: pointer; color: var(--orange); font-weight: 600; font-size: 13px; }
</style>
</head>
<body>

<!-- ─── 登录/注册页面 ─── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 id="authTitle">登录</h2>
    <div class="sub" id="authSub">登录后使用 Quantum Agent Platform</div>
    <div class="error" id="authError" style="display:none"></div>
    <form onsubmit="handleAuth();return false">
      <input id="authUsername" type="text" placeholder="用户名" autocomplete="username">
      <input id="authEmail" type="email" placeholder="邮箱（注册时需要）" autocomplete="email" style="display:none;">
      <input id="authPassword" type="password" placeholder="密码" autocomplete="current-password">
      <button id="authBtn" type="submit">登录</button>
    </form>
    <div class="switch">
      <span id="switchText">还没有账号？</span>
      <a id="switchLink" onclick="toggleAuthMode()">立即注册</a>
    </div>
  </div>
</div>

<header>
  <div class="logo">Q</div>
  <h1>Quantum Agent Platform</h1>
  <span class="badge">Planner → Executor → Critic</span>
  <span class="badge" id="sessionBadge" style="margin-left:8px;cursor:pointer" title="点击清除会话" onclick="clearSession()">新会话</span>
  <span class="badge logout-btn" id="logoutBtn" onclick="logout()" style="display:none">退出</span>
</header>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <div class="input-inner">
    <input id="queryInput" type="text" placeholder="描述你的计算化学任务..." onkeydown="if(event.key==='Enter')submitTask()">
    <button id="submitBtn" onclick="submitTask()">Send</button>
  </div>
  <div class="suggestions">
    <span class="suggestion" onclick="fill('优化苯结构并用B3LYP/6-31G*计算HOMO能级')">苯的优化与HOMO计算</span>
    <span class="suggestion" onclick="fill('优化乙醇结构并计算单点能')">乙醇结构优化</span>
    <span class="suggestion" onclick="fill('优化Ni催化剂结构并做频率分析')">Ni催化剂分析</span>
  </div>
</div>

<script>
// ─── 认证状态 ───
let authToken = localStorage.getItem('qap_token') || '';
let isRegisterMode = false;

function showAuth() {
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'none';
}

function hideAuth() {
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('logoutBtn').style.display = '';
}

function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('authTitle').textContent = isRegisterMode ? '注册' : '登录';
  document.getElementById('authSub').textContent = isRegisterMode ? '创建账号以使用平台' : '登录后使用 Quantum Agent Platform';
  document.getElementById('authEmail').style.display = isRegisterMode ? '' : 'none';
  document.getElementById('authBtn').textContent = isRegisterMode ? '注册' : '登录';
  document.getElementById('switchText').textContent = isRegisterMode ? '已有账号？' : '还没有账号？';
  document.getElementById('switchLink').textContent = isRegisterMode ? '去登录' : '立即注册';
  document.getElementById('authError').style.display = 'none';
}

async function handleAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const email = document.getElementById('authEmail').value.trim();
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('authBtn');

  if (!username || !password) {
    errEl.textContent = '请填写用户名和密码';
    errEl.style.display = '';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + (isRegisterMode ? '注册中...' : '登录中...');
  errEl.style.display = 'none';

  const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
  const body = isRegisterMode ? { username, password, email } : { username, password };

  let resp;
  try {
    resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch (e) {
    errEl.textContent = '无法连接到服务器，请确认服务已启动';
    errEl.style.display = '';
    btn.disabled = false;
    btn.innerHTML = isRegisterMode ? '注册' : '登录';
    return;
  }

  let data;
  try {
    data = await resp.json();
  } catch (e) {
    errEl.textContent = '服务器返回异常，请重试';
    errEl.style.display = '';
    btn.disabled = false;
    btn.innerHTML = isRegisterMode ? '注册' : '登录';
    return;
  }

  if (!resp.ok) {
    errEl.textContent = data.error || '请求失败 (' + resp.status + ')';
    errEl.style.display = '';
    btn.disabled = false;
    btn.innerHTML = isRegisterMode ? '注册' : '登录';
    return;
  }

  authToken = data.token;
  localStorage.setItem('qap_token', authToken);
  localStorage.setItem('qap_user', JSON.stringify(data.user));
  btn.disabled = false;
  btn.innerHTML = isRegisterMode ? '注册' : '登录';
  hideAuth();
}

function logout() {
  authToken = '';
  localStorage.removeItem('qap_token');
  localStorage.removeItem('qap_user');
  document.getElementById('authUsername').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authEmail').value = '';
  document.getElementById('authError').style.display = 'none';
  showAuth();
}

// 页面加载时检查登录状态
if (authToken) { hideAuth(); } else { showAuth(); }

// ─── 给所有 API 请求加上 JWT ───
function authFetch(url, options = {}) {
  options.headers = options.headers || {};
  if (authToken) {
    options.headers['Authorization'] = 'Bearer ' + authToken;
  }
  return fetch(url, options);
}

const chat = document.getElementById('chat');

// ---- 多轮对话：session_id 管理 ----
let sessionId = localStorage.getItem('qap_session_id') || '';
let thinkCounter = 0;

function updateSessionBadge() {
  const el = document.getElementById('sessionBadge');
  if (el) {
    el.textContent = sessionId ? '会话: ' + sessionId : '新会话';
    el.style.color = sessionId ? '#166534' : '#78716C';
  }
}

// Initial empty state
chat.innerHTML = '<div class="empty">'
  + '<div class="icon">&#x269B;</div>'
  + '<div style="font-size:18px;font-weight:600;margin-bottom:8px;">LLM-driven Computational Chemistry Agent</div>'
  + '<div style="font-size:13px;">输入科研任务，AI 自动拆解、执行工具、检查结果并自动纠错</div>'
  + '</div>';

function fill(text) {
  document.getElementById('queryInput').value = text;
}

function addUserMsg(text) {
  chat.innerHTML = chat.innerHTML.replace(/<div class="empty">[\s\S]*?<\/div>\n?/, '');
  chat.insertAdjacentHTML('beforeend',
    '<div class="msg user">'
    + '<div class="avatar">U</div>'
    + '<div class="bubble">' + escapeHtml(text) + '</div>'
    + '</div>');
}

function addAssistantMsg(content, label) {
  chat.insertAdjacentHTML('beforeend',
    '<div class="msg assistant">'
    + '<div class="avatar">A</div>'
    + '<div class="bubble">'
    + (label ? '<div class="label">' + label + '</div>' : '')
    + content
    + '</div></div>');
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function renderPlan(plan) {
  if (!plan || plan.length === 0) return '<span style="color:#A8A29E">No plan generated</span>';
  let html = '<div class="plan-list">';
  plan.forEach((s, i) => {
    const tool = s.step || s.tool || 'unknown';
    const action = s.action || '';
    const params = s.params || {};
    const isReasoning = s.type === 'reasoning';
    html += '<div class="plan-item' + (isReasoning ? ' plan-reasoning' : '') + '">'
      + '<div class="plan-idx">' + (i+1) + '</div>'
      + '<div class="plan-body">'
      + '<div class="plan-tool">'
      + (isReasoning ? '<span class="type-badge reasoning">LLM</span> ' : '<span class="type-badge tool">TOOL</span> ')
      + '<span class="tool-name">' + escapeHtml(tool) + '</span>'
      + (action ? '<span class="plan-action">' + escapeHtml(action) + '</span>' : '')
      + '</div>'
      + (isReasoning ? '' : '<div class="plan-params">' + Object.entries(params).map(([k, v]) =>
          '<span class="param-tag">' + escapeHtml(k) + ': ' + escapeHtml(String(v)) + '</span>'
        ).join('') + '</div>')
      + '</div></div>';
  });
  html += '</div>';
  return html;
}

function renderResults(results) {
  if (!results || results.length === 0) return '<span style="color:#A8A29E">No results yet</span>';
  let html = '<div class="result-list">';
  results.forEach((r, i) => {
    const out = r.output || {};
    const ok = out.status === 'success';
    html += '<div class="result-row ' + (ok ? 'ok' : 'fail') + '">'
      + '<div class="result-dot ' + (ok ? 'green' : 'red') + '"></div>'
      + '<span class="result-step">Step ' + (i+1) + '</span>'
      + '<span class="result-tool">' + escapeHtml(out.tool || 'unknown') + '</span>'
      + '<span class="result-status ' + (ok ? 'success' : 'error') + '">' + escapeHtml(out.status || '?') + '</span>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

function renderVerdict(v) {
  if (!v || Object.keys(v).length === 0) return '<span style="color:#A8A29E">Waiting for review</span>';
  const passed = v.passed;
  let html = '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">';
  html += '<div class="v-header">'
    + '<span class="icon">' + (passed ? '&#x2705;' : '&#x26A0;') + '</span>'
    + (passed ? 'PASS — 结果验证通过' : 'FAIL — 结果验证未通过')
    + '</div>';
  html += '<div class="v-reason">' + escapeHtml(v.reason || '') + '</div>';
  if (v.suggestions) {
    html += '<div class="v-suggest">Suggestion: ' + escapeHtml(v.suggestions) + '</div>';
  }
  html += '</div>';
  return html;
}

function renderStatus(data) {
  const status = data.status || 'unknown';
  const retry = data.retry_count || 0;
  return '<div class="status-line">'
    + '<span>Status: <span class="val">' + escapeHtml(status) + '</span></span>'
    + '<span>Task: <span class="val">' + escapeHtml(data.task_id || '-') + '</span></span>'
    + '<span>Retries: <span class="val">' + retry + '</span></span>'
    + '</div>';
}

async function submitTask() {
  const query = document.getElementById('queryInput').value.trim();
  if (!query) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Running';

  addUserMsg(query);
  document.getElementById('queryInput').value = '';

  let thinkingP = null;

  try {
    thinkCounter++;
    const thinkId = 'thinkText-' + thinkCounter;

    const resp = await authFetch('/api/workflow/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ input_data: { user_query: query }, session_id: sessionId || null })
    });

    if (!resp.ok) {
      let errMsg = '请求失败 (' + resp.status + ')';
      try {
        const errData = await resp.json();
        errMsg = errData.error || errMsg;
      } catch (_) {}
      addAssistantMsg('<span style="color:#EF4444">' + escapeHtml(errMsg) + '</span>', 'ERROR');
      if (resp.status === 401) {
        logout();
      }
      btn.disabled = false;
      btn.innerHTML = 'Send';
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let event;
        try {
          event = JSON.parse(part.slice(6));
        } catch (e) {
          console.error('JSON parse error:', e, 'part:', part.slice(0, 200));
          continue;
        }
        console.log('[SSE]', event.event, event.data);

        switch (event.event) {

          case 'rag_done':
            // RAG 检索完成，静默记录
            console.log('[SSE] RAG context loaded, length:', event.data?.context_len);
            break;

          case 'thinking_chunk':
            if (!thinkingP) {
              addAssistantMsg('<p id="' + thinkId + '" style="white-space:pre-wrap"></p>', 'THINKING');
              thinkingP = document.getElementById(thinkId);
            }
            thinkingP.textContent += event.data;
            break;

          case 'plan_done':
            console.log('[SSE] plan_done received, steps:', event.data?.length);
            addAssistantMsg(renderPlan(event.data), 'PLAN — ' + (event.data?.length || 0) + ' steps');
            break;

          case 'step_start': {
            const s = event.data;
            addAssistantMsg(
              '<div class="result-row ok">'
              + '<div class="result-dot green"></div>'
              + '<span class="result-step">Step ' + (s.index + 1) + '</span>'
              + '<span class="result-tool">' + escapeHtml(s.step.step || '') + '</span>'
              + '<span class="result-status success">running...</span>'
              + '</div>',
              'EXECUTING Step ' + (s.index + 1)
            );
            break;
          }

          case 'step_done': {
            const s = event.data;
            const ok = s.result.status === 'success';
            addAssistantMsg(
              '<div class="result-row ' + (ok ? 'ok' : 'fail') + '">'
              + '<div class="result-dot ' + (ok ? 'green' : 'red') + '"></div>'
              + '<span class="result-step">Step ' + (s.index + 1) + '</span>'
              + '<span class="result-tool">' + escapeHtml((s.result || {}).tool || '') + '</span>'
              + '<span class="result-status ' + (ok ? 'success' : 'error') + '">' + escapeHtml(s.result.status || '?') + '</span>'
              + '</div>',
              ok ? 'DONE' : 'FAILED'
            );
            break;
          }

          case 'verdict_done':
            addAssistantMsg(renderVerdict(event.data), 'CRITIC REVIEW');
            break;

          case 'retry':
            addAssistantMsg(
              '<span style="color:#D97706">Retrying... (' + event.data.retry_count + '/3)</span>',
              'RETRY'
            );
            break;

          case 'done':
            if (event.data && event.data.session_id) {
              sessionId = event.data.session_id;
              localStorage.setItem('qap_session_id', sessionId);
              updateSessionBadge();
            }
            addAssistantMsg(
              '<span style="color:#22C55E">' + (event.data.status === 'passed' ? 'Task completed.' : 'Reached max retries.') + '</span>',
              'COMPLETE'
            );
            break;

          case 'error':
            addAssistantMsg(
              '<span style="color:#EF4444">服务异常: ' + escapeHtml(event.data?.message || '未知错误') + '</span>',
              'ERROR'
            );
            break;

          default:
            console.log('[SSE] unhandled event:', event.event, event.data);
            break;
        }
      }
    }
  } catch (e) {
    addAssistantMsg('<span style="color:#EF4444">Error: ' + escapeHtml(e.message) + '</span>');
  }

  btn.disabled = false;
  btn.innerHTML = 'Send';
  chat.scrollTop = chat.scrollHeight;
}

function clearSession() {
  if (confirm('清除当前会话？下次提问将开启新对话')) {
    sessionId = '';
    localStorage.removeItem('qap_session_id');
    updateSessionBadge();
    chat.innerHTML = '<div class="empty">'
      + '<div class="icon">&#x269B;</div>'
      + '<div style="font-size:18px;font-weight:600;margin-bottom:8px;">LLM-driven Computational Chemistry Agent</div>'
      + '<div style="font-size:13px;">会话已清除，开始新对话</div>'
      + '</div>';
  }
}

updateSessionBadge();
</script>
